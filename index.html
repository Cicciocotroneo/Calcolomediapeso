<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Peso Tracker Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --primary: #1a73e8; --bg: #f8f9fa; --card: #ffffff; --text: #202124; --danger: #ea4335; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg); margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; color: var(--text); }
        .card { background: var(--card); padding: 20px; border-radius: 16px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); width: 100%; max-width: 450px; box-sizing: border-box; margin-bottom: 15px; }
        .input-row { display: flex; gap: 10px; width: 100%; margin-bottom: 12px; }
        #dateInput { flex: 1.5; min-width: 0; }
        #weightInput { flex: 1; min-width: 0; }
        input { width: 100%; padding: 12px; border: 1px solid #dadce0; border-radius: 8px; font-size: 16px; box-sizing: border-box; background: white; }
        button.main-btn { background-color: var(--primary); color: white; border: none; padding: 14px; border-radius: 8px; font-size: 16px; font-weight: 600; width: 100%; cursor: pointer; }
        .slider-section { margin-top: 25px; padding-top: 15px; border-top: 1px solid #f1f3f4; text-align: center; width: 100%; }
        input[type=range] { width: 100%; margin: 15px 0; display: block; }
        .range-labels { display: flex; justify-content: space-between; font-size: 0.75rem; color: #70757a; padding: 0 5px; }
        .scroll-table { max-height: 250px; overflow-y: auto; }
        table { width: 100%; border-collapse: collapse; }
        td { padding: 12px 8px; border-bottom: 1px solid #f1f3f4; font-size: 0.9rem; }
        .btn-del { background: #fce8e6; color: var(--danger); border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="card">
        <div class="input-row">
            <input type="date" id="dateInput">
            <input type="number" step="0.1" id="weightInput" placeholder="Kg">
        </div>
        <button class="main-btn" onclick="addData()">Salva Peso</button>
        
        <div style="margin-top: 20px; width: 100%;">
            <canvas id="weightChart"></canvas>
        </div>

        <div class="slider-section">
            <div>Vista: <span id="rangeLabel" style="font-weight:bold; color:var(--primary)">30</span> giorni</div>
            <input type="range" id="viewSlider" min="7" max="100" value="30" oninput="updateUI()">
            <div class="range-labels">
                <span>7 gg</span>
                <span>Tutto</span>
            </div>
        </div>
    </div>

    <div class="card">
        <h3 style="margin-top:0">Storico</h3>
        <div class="scroll-table">
            <table><tbody id="tableBody"></tbody></table>
        </div>
    </div>

    <script>
        const initialData = [
            {"date": "2026-01-08", "weight": 92.2}, {"date": "2026-02-02", "weight": 90.0}, {"date": "2026-02-14", "weight": 88.8},
            {"date": "2026-02-16", "weight": 89.4}, {"date": "2026-02-18", "weight": 89.2}, {"date": "2026-02-24", "weight": 89.4},
            {"date": "2026-02-25", "weight": 88.6}, {"date": "2026-02-26", "weight": 88.2}, {"date": "2026-02-27", "weight": 88.6},
            {"date": "2026-02-28", "weight": 88.4}, {"date": "2026-03-08", "weight": 88.2}, {"date": "2026-03-10", "weight": 87.6},
            {"date": "2026-03-11", "weight": 87.0}, {"date": "2026-03-12", "weight": 87.4}, {"date": "2026-03-13", "weight": 87.2},
            {"date": "2026-03-14", "weight": 87.5}, {"date": "2026-03-15", "weight": 88.0}, {"date": "2026-03-17", "weight": 87.7},
            {"date": "2026-03-19", "weight": 87.1}, {"date": "2026-03-20", "weight": 87.1}, {"date": "2026-03-21", "weight": 86.5},
            {"date": "2026-03-22", "weight": 87.5}, {"date": "2026-03-23", "weight": 86.9}, {"date": "2026-03-24", "weight": 87.0},
            {"date": "2026-03-25", "weight": 86.5}, {"date": "2026-03-26", "weight": 86.2}, {"date": "2026-03-27", "weight": 85.7},
            {"date": "2026-03-29", "weight": 86.9}, {"date": "2026-03-30", "weight": 86.5}, {"date": "2026-03-31", "weight": 86.4},
            {"date": "2026-04-01", "weight": 86.0}, {"date": "2026-04-02", "weight": 85.8}, {"date": "2026-04-03", "weight": 85.6},
            {"date": "2026-04-04", "weight": 85.5}, {"date": "2026-04-05", "weight": 84.9}, {"date": "2026-04-06", "weight": 84.9},
            {"date": "2026-04-08", "weight": 85.1}, {"date": "2026-04-09", "weight": 85.2}, {"date": "2026-04-10", "weight": 85.3},
            {"date": "2026-04-11", "weight": 85.3}, {"date": "2026-04-12", "weight": 85.6}, {"date": "2026-04-13", "weight": 85.4},
            {"date": "2026-04-14", "weight": 85.1}, {"date": "2026-04-15", "weight": 85.1}, {"date": "2026-04-16", "weight": 84.7},
            {"date": "2026-04-17", "weight": 83.9}, {"date": "2026-04-18", "weight": 83.7}, {"date": "2026-04-19", "weight": 84.4},
            {"date": "2026-04-20", "weight": 84.0}, {"date": "2026-04-21", "weight": 84.0}, {"date": "2026-04-22", "weight": 84.2},
            {"date": "2026-04-23", "weight": 84.2}, {"date": "2026-04-24", "weight": 84.6}, {"date": "2026-04-25", "weight": 83.8},
            {"date": "2026-04-26", "weight": 84.6}, {"date": "2026-04-27", "weight": 84.2}
        ];

        let myWeights = JSON.parse(localStorage.getItem('weightData')) || initialData;
        let chart;

        function initChart() {
            const ctx = document.getElementById('weightChart').getContext('2d');
            chart = new Chart(ctx, {
                type: 'line',
                data: { labels: [], datasets: [
                    { label: 'Peso Reale', data: [], borderColor: '#1a73e8', backgroundColor: 'rgba(26,115,232,0.1)', fill: true, spanGaps: true, tension: 0.2, pointRadius: 3 },
                    { label: 'Media 7g', data: [], borderColor: '#ea4335', borderDash: [5, 5], pointRadius: 0, tension: 0.4 }
                ]},
                options: {
                    responsive: true,
                    interaction: { mode: 'index', intersect: false },
                    scales: { 
                        y: { ticks: { font: { size: 10 } } },
                        x: { ticks: { maxRotation: 45, minRotation: 45, font: { size: 10 } } }
                    },
                    plugins: { 
                        legend: { display: true, position: 'bottom', labels: { boxWidth: 20, font: { size: 12 } } } 
                    }
                }
            });
            document.getElementById('viewSlider').max = calculateTotalDays();
            updateUI();
        }

        function calculateTotalDays() {
            if (myWeights.length < 2) return 7;
            const dates = myWeights.map(w => new Date(w.date));
            return Math.ceil(Math.abs(Math.max(...dates) - Math.min(...dates)) / 86400000) + 1;
        }

        function updateUI() {
            myWeights.sort((a, b) => new Date(a.date) - new Date(b.date));
            localStorage.setItem('weightData', JSON.stringify(myWeights));
            const daysToView = parseInt(document.getElementById('viewSlider').value);
            document.getElementById('rangeLabel').innerText = daysToView;
            const lastEntryDate = new Date(myWeights[myWeights.length - 1].date);
            
            // Padding finale: aggiungiamo un giorno extra invisibile per evitare il taglio
            const end = new Date(lastEntryDate);
            end.setDate(end.getDate() + 1); 

            const start = new Date(lastEntryDate); 
            start.setDate(start.getDate() - (daysToView - 1));

            const dateArray = [], weightValues = [], ma7Values = [];

            for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
                const dateStr = d.toISOString().split('T')[0];
                dateArray.push(d.toLocaleDateString('it-IT', {day:'2-digit', month:'2-digit'}));
                const entry = myWeights.find(w => w.date === dateStr);
                weightValues.push(entry ? entry.weight : null);
                const winStart = new Date(d); winStart.setDate(winStart.getDate() - 6);
                const weekEntries = myWeights.filter(w => { const de = new Date(w.date); return de >= winStart && de <= d; });
                ma7Values.push(weekEntries.length > 0 ? (weekEntries.reduce((a,c)=>a+c.weight,0)/weekEntries.length).toFixed(2) : null);
            }
            chart.data.labels = dateArray; chart.data.datasets[0].data = weightValues; chart.data.datasets[1].data = ma7Values; chart.update();
            const tbody = document.getElementById('tableBody'); tbody.innerHTML = '';
            [...myWeights].reverse().forEach(item => {
                tbody.innerHTML += `<tr><td>${new Date(item.date).toLocaleDateString('it-IT')}</td><td style="font-weight:600">${item.weight} kg</td><td style="text-align:right"><button class="btn-del" onclick="deleteEntry('${item.date}')">Elimina</button></td></tr>`;
            });
        }

        function addData() {
            const date = document.getElementById('dateInput').value, weight = parseFloat(document.getElementById('weightInput').value);
            if (!date || isNaN(weight)) return;
            const i = myWeights.findIndex(w => w.date === date);
            if (i > -1) myWeights[i].weight = weight; else myWeights.push({date, weight});
            document.getElementById('viewSlider').max = calculateTotalDays();
            updateUI();
        }

        function deleteEntry(date) { if(confirm("Eliminare?")) { myWeights = myWeights.filter(w => w.date !== date); updateUI(); } }

        window.onload = initChart;
        document.getElementById('dateInput').valueAsDate = new Date();
    </script>
</body>
</html>
